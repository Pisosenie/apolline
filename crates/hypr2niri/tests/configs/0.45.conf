# Hyprland 0.45–0.47: shadows in their own block, device { name }, bindd, windowrulev2.
$mod = SUPER
monitor = desc:Dell Inc. DELL U2720Q 123ABC, 3840x2160@60, 0x0, 1.5

env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORMTHEME,qt6ct

device {
    name = logitech-g502
    sensitivity = 0.2
}

decoration {
    rounding = 8
    active_opacity = 0.95
    inactive_opacity = 0.85
    shadow {
        enabled = true
        range = 12
        color = 0xee1a1a1a
    }
    blur {
        enabled = true
        size = 3
    }
}

windowrulev2 = float, class:^(org\.gnome\.Calculator)$
windowrulev2 = size 800 600, class:^(org\.gnome\.Calculator)$
windowrulev2 = workspace name:chat silent, class:^(org\.telegram\.desktop)$
windowrulev2 = noblur, class:^(firefox)$, xwayland:1
layerrule = blur, waybar
blurls = rofi

exec-once = [workspace 2 silent] firefox
bindd = $mod, Return, Open a terminal, exec, foot
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = $mod, F, fullscreen, 1
bind = $mod, S, togglespecialworkspace, magic
bind = $mod, X, exec, hyprctl dispatch exit
