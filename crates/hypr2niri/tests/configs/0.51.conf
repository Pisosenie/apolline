# Hyprland 0.51–0.52: monitorv2 blocks and the gesture keyword.
monitorv2 {
    output = eDP-1
    mode = 2880x1800@90
    position = 0x0
    scale = 1.75
    vrr = 1
}
monitorv2 {
    output = DP-2
    disabled = true
}

gesture = 3, horizontal, workspace
gesture = 4, pinch, fullscreen

decoration {
    rounding = 12
    rounding_power = 4
}

windowrule = float, class:^(blueman-manager)$
windowrulev2 = opacity 0.9 0.8, class:^(kitty)$

bind = SUPER, Q, exec, kitty
bind = SUPER, Q, exec, foot
