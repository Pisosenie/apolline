# Hyprland 0.53–0.56: rules with match:, values everywhere, and rule blocks.
windowrule = match:class ^(pavucontrol)$, float on, size 900 600
windowrule = match:title ^(Picture-in-Picture)$, float on, pin on
windowrule = match:class negative:^(kitty)$, match:float false, no_shadow on

windowrule {
    name = mail
    match:class = thunderbird
    monitor = DP-1
    no_initial_focus = yes
}

layerrule = blur on, match:namespace waybar
layerrule {
    name = launcher
    match:namespace = rofi
    blur = on
    ignore_alpha = 0.3
}

cursor {
    inactive_timeout = 3
    hide_on_key_press = true
}

animations {
    enabled = false
}

bind = SUPER, R, exec, rofi -show drun
