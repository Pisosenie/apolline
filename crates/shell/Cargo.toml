[package]
name = "apolline-shell"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "apolline"
path = "src/main.rs"

[dependencies]
apolline-theme.workspace = true
apolline-config.workspace = true
apolline-niri.workspace = true
iced.workspace = true
tokio.workspace = true
chrono.workspace = true
image.workspace = true
png.workspace = true
zbus.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
iced_layershell = "0.19"
iced_sessionlock = "0.19"
pam = "0.8"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
