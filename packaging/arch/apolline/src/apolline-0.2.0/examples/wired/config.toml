# Wired: a rice after Serial Experiments Lain. Present day, present time.

[desktop]
wallpaper = "wired.png"
palette = "wallpaper"
accent = "#e8434b"
icons = "Cosmic"
cursor_size = 32
clock = "top-left"
widgets = ["weather", "agenda", "media", "wired"]

[layout]
gaps = 12
radius = 2
borders = true
border_width = 2
shadows = false

[windows]
width = "1/2"
presets = ["1/3", "1/2", "2/3"]
inactive_opacity = 0.88
motion = "snappy"
appear = "fade"
warp_mouse = true

[bar]
position = "top"
floating = false
shape = "bar"
opacity = 0.72
workspaces = "numbers"
stats = ["cpu", "memory"]
left = ["workspaces", "windows"]
center = ["clock"]
right = ["media", "recording", "wired", "stats", "tray"]
weather = "Berlin"
pinned = ["vif"]

[style.bar]
radius = 0
size = 0.92
font = "DejaVu Sans Mono"

[style.launcher]
radius = 2
font = "DejaVu Sans Mono"

[style.panel]
radius = 2

[style.notifications]
radius = 2
font = "DejaVu Sans Mono"

[style.osd]
radius = 2

[[module]]
name = "wired"
command = "~/.config/apolline/wired/wired.sh"
every = 30
