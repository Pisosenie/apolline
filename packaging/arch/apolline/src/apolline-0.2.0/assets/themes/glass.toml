[theme]
name = "Glass"
author = "Apolline"

[desktop]
wallpaper = "night.jpg"
accent = "#c084fc"

[layout]
gaps = 16
radius = 18
borders = true
gradient = true
shadows = true

[windows]
opacity = 0.9
inactive_opacity = 0.78
motion = "smooth"
appear = "pop"
blur = "all"

[bar]
position = "top"
floating = true
opacity = 0.3
blur = true
