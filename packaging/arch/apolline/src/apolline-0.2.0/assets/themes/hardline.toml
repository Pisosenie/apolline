[theme]
name = "Hardline"
author = "Apolline"

[desktop]
wallpaper = "ember.jpg"
accent = "palette"
palette = "gruvbox"

[layout]
gaps = 4
radius = 0
borders = true
shadows = false

[windows]
animations = 2
motion = "snappy"

[bar]
position = "top"
floating = false
opacity = 1.0

[style.bar]
radius = 0
size = 0.9

[style.launcher]
radius = 0

[style.panel]
radius = 0

[style.notifications]
radius = 0

[style.osd]
radius = 0
