[theme]
name = "Night"
author = "Apolline"

[desktop]
wallpaper = "night.jpg"
accent = "auto"

[layout]
gaps = 8
radius = 10
borders = true
shadows = true

[windows]
animations = 0.75
inactive_opacity = 0.9
motion = "smooth"
appear = "slide"
blur = "wallpaper"

[bar]
position = "bottom"
floating = true
opacity = 0.45
blur = true
