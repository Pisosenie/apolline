[theme]
name = "Tokyo Night"
author = "Apolline"

[desktop]
wallpaper = "tokyo.jpg"
accent = "palette"
palette = "tokyo-night"

[layout]
gaps = 8
radius = 10
borders = true
shadows = true

[windows]
motion = "snappy"

[bar]
position = "left"
floating = true
opacity = 0.9

[style.bar]
radius = 12

[style.panel]
radius = 12
