[theme]
name = "Everforest"
author = "Apolline"

[desktop]
wallpaper = "forest.jpg"
accent = "palette"
palette = "everforest"

[layout]
gaps = 12
radius = 14
borders = false
shadows = true

[windows]
motion = "bouncy"

[bar]
position = "top"
floating = true
shape = "islands"
opacity = 0.85

[style.bar]
radius = 14

[style.panel]
radius = 14
