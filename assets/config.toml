# Apolline reads this file when it starts.
# Anything it does not understand is reported and skipped — the rest still applies.
# Check it at any time with:  apolline check

[general]
mode = ""                  # the mode to start in, by name; empty means none
# check_updates = false    # Apolline looks once a day for a newer release and says so once

[desktop]
wallpaper = "fog.jpg"      # fog.jpg, ember.jpg, night.jpg, a path to your own, or a video, shader or Wallpaper Engine folder
accent = "auto"            # "auto" follows the wallpaper, "palette" the palette's own, or a color like "#86bdf0"
palette = "dark"           # dark, light, catppuccin-mocha, gruvbox, nord, tokyo-night, rose-pine, paper… or wallpaper
clock = "off"              # a big clock on the wallpaper: center, top-left, top, top-right, bottom-left, bottom, bottom-right

[layout]
gaps = 10
radius = 12
borders = true
border_width = 1           # 1 is a hairline, up to 8 for a frame
shadows = true

[bar]
workspaces = "dots"        # dots or numbers
seconds = false
date = true
battery_percent = true
position = "top"          # top, bottom, left or right
floating = true            # an island with a gap, or edge to edge
shape = "bar"              # bar, or islands: a pill for each side and the middle
opacity = 0.55             # how solid the glass is, 0 to 1
# What goes where, in order (this is the bar as it comes):
# left = ["mode", "workspaces", "windows"]
# center = ["clock"]
# right = ["media", "notifications", "recording", "modules", "stats", "apps", "tray"]
# tray = ["keyboard", "awake", "wifi", "bluetooth", "volume", "battery"]

# A dock of pinned and open apps, off as it comes:
# [dock]
# show = true
# position = "bottom"      # bottom, left or right
# autohide = true          # out when the pointer reaches the edge
# size = 48                # icon size, 32 to 96
# magnify = true

[notifications]
position = "top-right"     # top-left, top, top-right, bottom-left, bottom or bottom-right
do_not_disturb = false     # hold everything but urgent, in every mode
seconds = 5                # how long a popup stays

[shortcuts]
launcher = "Mod+Space"     # Mod is Super, or Alt when niri runs in a window
panel = "Mod+A"
switch = "Mod+Shift+M"
lock = "Super+Alt+L"
clipboard = "Mod+Alt+V"
keys = "Mod+Slash"         # every shortcut, searchable
terminal = "Mod+T"
replay = "Mod+Alt+R"       # save the last moments, in a mode that keeps them
stay = "Mod+Shift+G"       # keep a game from losing the focus to a stray key; again to let go
layout = ""                # next keyboard layout on any keys, like "Mod+Space"; empty leaves it to [keyboard] switch

# Keys of your own, in every mode: a command, or one of niri's actions. They win over the same
# keys in niri's config; Apolline's own above and a mode's keys win over them.
# [keys]
# "Mod+Return" = "kitty"
# "Mod+C" = { niri = "close-window" }

[lock]
before_sleep = true        # lock when the laptop goes to sleep
show_media = true          # what's playing, with a pause button
fingerprint = false        # a finger on the reader unlocks it instead of the password (fprintd)
layout = "corner"          # corner: clock and password bottom left; center: both in the middle
blur = false               # blur the wallpaper behind it
# wallpaper = "fog.jpg"    # its own wallpaper; leave out to show the desktop's

[idle]                     # minutes without touching anything, 0 means never
lock_after = 5
screen_off_after = 10
suspend_after = 0

# Keyboard, touchpad and mouse are left to your niri config until you set
# them here or in apolline settings.
#
# [keyboard]
# layouts = ["us", "ru"]
# switch = "alt-shift"     # alt-shift, ctrl-shift, super-space or caps
# repeat_delay = 600       # ms before a held key repeats
# repeat_rate = 25         # repeats per second
#
# [touchpad]
# tap = true
# natural_scroll = true
# disable_while_typing = true
# speed = 0.0              # -1.0 slow … 1.0 fast
#
# [mouse]
# natural_scroll = false
# acceleration = true
# speed = 0.0

# Modes are optional. Each one changes the desktop while it's on, and its keys
# exist only in that mode. Make them in apolline settings, or by hand:
#
# [[mode]]
# name = "Play"
# icon = "gamepad"         # briefcase, gamepad, moon, target, presentation, code, book, music…
# wallpaper = "ember.jpg"  # leave out to keep the desktop's
# accent = "auto"
# notifications = "hold"   # all, mentions or hold
# open = ["steam"]
# performance = true       # power profile, games drive the refresh rate, effects off
# keep_awake = true
# keys = { "Mod+G" = "steam", "Mod+Shift+D" = "discord" }
# windows = [              # put back where they were: Settings → Modes → Remember
#     { app = "steam", run = "steam", workspace = 2, column = 1, width = 100 },
# ]
