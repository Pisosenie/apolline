# Wired: vif in Apolline colors, through a CRT.

[font]
family = "DejaVu Sans Mono"
size = 12
line_height = 1.25

[colors]
from = "~/.cache/apolline/terminal.json"

[window]
padding = [18, 14]
opacity = 0.86
radius = 2
shader = ["crt"]

[cursor]
shape = "block"
blink = true

[tabs]
show = "many"
style = "plain"
