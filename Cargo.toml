[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
apolline-theme = { path = "crates/theme" }
apolline-config = { path = "crates/config" }
apolline-niri = { path = "crates/niri" }
iced = { version = "0.14", features = ["image", "svg", "tokio", "canvas", "advanced"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
ab_glyph = "0.2"
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd", "png-format"] }
tokio = { version = "1", features = ["net", "io-util", "time", "rt", "process", "sync"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
zbus = { version = "6", default-features = false, features = ["tokio", "proxy", "service"] }
toml = "1.1"
toml_edit = "0.25"
strsim = "0.11"
chrono = "0.4"
chrono-tz = "0.10"
png = "0.18"
ureq = "3"
base64 = "0.23"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Both redraw after a present comes back Outdated or Lost; upstream 0.19.1 gives
# up on the surface, which freezes every layer on NVIDIA.
[patch.crates-io]
iced_layershell = { path = "vendor/iced_layershell" }
iced_sessionlock = { path = "vendor/iced_sessionlock" }
iced_layershell_macros = { path = "vendor/iced_layershell_macros" }
