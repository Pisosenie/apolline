[theme]
name = "Rosé Dawn"
author = "Apolline"

[desktop]
wallpaper = "dawn.jpg"
accent = "palette"
palette = "rose-pine-dawn"

[layout]
gaps = 10
radius = 16
borders = false
shadows = true

[windows]
motion = "smooth"

[bar]
position = "top"
floating = true
shape = "islands"
opacity = 0.85

[style.bar]
radius = 16

[style.panel]
radius = 16
