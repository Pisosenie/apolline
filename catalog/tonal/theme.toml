[theme]
name = "Tonal"
author = "Apolline"

[desktop]
wallpaper = "fog.jpg"
accent = "auto"
palette = "wallpaper"

[layout]
gaps = 14
radius = 20
borders = false
shadows = true

[windows]
motion = "bouncy"
appear = "pop"

[bar]
position = "top"
floating = true
shape = "islands"
opacity = 0.8

[style.bar]
radius = 18

[style.launcher]
radius = 28

[style.panel]
radius = 28

[style.notifications]
radius = 22
