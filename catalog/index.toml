# The theme catalog Settings → Appearance → More themes reads.
# A theme is a folder here with its theme.toml and pictures; add yours with a pull request.
# Its preview.jpg is what CI renders of it: take it from the run's previews.
# A Wallpaper Engine scene goes in by its Workshop id, [theme] scene = "…", never as files.

[[theme]]
name = "Rosé Dawn"
author = "Apolline"
about = "Soft morning, islands"
folder = "rose-dawn"
files = ["theme.toml", "dawn.jpg"]
preview = "preview.jpg"

