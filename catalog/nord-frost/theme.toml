[theme]
name = "Nord Frost"
author = "Apolline"

[desktop]
wallpaper = "frost.jpg"
accent = "palette"
palette = "nord"

[layout]
gaps = 12
radius = 12
borders = false
shadows = true

[windows]
motion = "smooth"

[bar]
position = "bottom"
floating = true
opacity = 0.8

[style.bar]
radius = 12

[style.panel]
radius = 12
