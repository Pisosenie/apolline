[theme]
name = "Dracula"
author = "Apolline"

[desktop]
wallpaper = "dusk.jpg"
accent = "palette"
palette = "dracula"

[layout]
gaps = 10
radius = 12
borders = true
shadows = true

[windows]
motion = "bouncy"

[bar]
position = "right"
floating = true
opacity = 0.9

[style.bar]
radius = 12

[style.panel]
radius = 12
